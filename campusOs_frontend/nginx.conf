# CampusOS frontend — static bundle plus a same-origin API proxy.
#
# The proxy is not a convenience. The session cookies are HttpOnly and SameSite,
# so the browser is right to send them only to the origin it loaded the page
# from; pointing the client at a different host for /api would mean either
# cross-site cookies or a CORS exception, and both are a worse answer than a
# proxy that never leaves the origin.

upstream campusos_api {
    # Compose service name. Resolved at startup, so a restarted backend gets a
    # fresh IP without nginx needing to be told.
    server api:5050;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Certificate uploads are capped at 10MB in the application. Allow a little
    # more here so the application's own error message is the one the user sees,
    # rather than nginx's bare 413 with no explanation.
    client_max_body_size 12m;

    # Compress text. Images are already compressed, so sending them through
    # gzip costs CPU and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ===== Security headers =====
    #
    # Mirrored from the application's own development CSP so the two do not
    # drift. `connect-src 'self'` covers /api because the proxy above makes it
    # same-origin; there is no second origin to allow.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # HSTS is only honoured over TLS, and is actively harmful to send over plain
    # HTTP — so it belongs on the TLS terminator, not here. Left out on purpose.

    # ===== API =====
    location /api/ {
        proxy_pass http://campusos_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application decides whether a client is local from this.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-poll style responses and document downloads must not be cut off
        # mid-stream: the default 60s is shorter than a large PDF takes to
        # generate, and a truncated download looks like a server fault.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== Assets =====
    #
    # Vite fingerprints every filename, so a file at a hashed URL cannot change
    # meaning. That is what makes a year-long cache safe here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ===== The SPA =====
    #
    # /requests and /certificates are client-side routes with no file behind
    # them. Everything that is not a real file falls through to index.html —
    # but a missing *asset* must 404, not quietly return HTML, or a typo in a
    # script URL produces a confusing "Unexpected token <" in the console.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # Never cache the entry document. It holds the hashed asset URLs, and a
        # cached copy points at a bundle the server has already deleted.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}