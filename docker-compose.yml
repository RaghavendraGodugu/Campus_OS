# CampusOS — single-host production stack.
#
#     cp campusOs_backend/.env.example .env
#     docker compose up --build
#
# This stack expects TLS in front of the web container. Session cookies are
# Secure in production, so signing in over plain HTTP will not work.
#
# This is deliberately not a cluster. Everything that would need coordination —
# a second node, a shared rate-limit store, a replica set — is called out in
# DEPLOY.md as the next step rather than half-configured here.

name: campusos

services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: campusos
    volumes:
      - mongo-data:/data/db
    # Not published to the host by default. The API reaches it over the internal
    # network; publishing 27017 would put the database on every interface the
    # machine has, and the port is scanned constantly.
    expose:
      - "27017"
    healthcheck:
      # `ping` rather than a find: it needs no credentials and no index, so it
      # cannot fail for a reason unrelated to "is Mongo up".
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: campusOs_backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Wait for the database to actually accept queries, not merely to have
        # started. Otherwise the API boots, fails to connect, and exits — and
        # `restart: unless-stopped` turns that into a visible crash loop.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5050"
      MONGO_URI: ${MONGO_URI:-mongodb://db:27017/campusos}
      # The browser origin that will reach this stack. Must be HTTPS in
      # production because session cookies are Secure.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      WEB_URL: ${WEB_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "false"
      # Secrets come from a .env beside this file, not from here. Committing a
      # value into a compose file is how test credentials reach production.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET in .env}
      # Production validation requires all three Razorpay values. A real
      # webhook URL is https://<host>/api/v1/payments/webhook/razorpay.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET in .env}
      # Production document storage requires Cloudinary, not the local volume.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
      # Password-reset and verification links are broken without a real sender.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-CampusOS <no-reply@campusos.local>}"
    expose:
      - "5050"

  web:
    build:
      context: .
      dockerfile: campusOs_frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Published: this is the only service a browser talks to.
      - "${WEB_PORT:-8080}:8080"

volumes:
  mongo-data:
